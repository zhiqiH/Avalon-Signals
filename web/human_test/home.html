<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Avalon Signals · 真人测试</title>
  <link rel="stylesheet" href="/common.css">
  <script src="/i18n.js"></script>
  <script src="/home.js" defer></script>
</head>
<body class="undecided" data-title="home.title">
  <header class="bar">
    <a class="logo" href="/"><i>A</i><span>AVALON SIGNALS</span></a>
    <button class="ibtn" data-lang-toggle aria-label="Language">EN</button>
  </header>
  <main class="wrap">
    <section class="hero">
      <h1 data-t="home.title">Avalon Signals · 真人测试</h1>
      <p data-t="home.sub">六人阿瓦隆 · AI 为冻结的强化学习策略</p>
    </section>

    <section class="consent" role="radiogroup" aria-labelledby="share-q">
      <span id="share-q" data-t="share.q">是否同意将数据用于研究？</span>
      <div class="chips">
        <button class="chip good" data-share="yes" aria-pressed="false" data-t="share.yes">同意</button>
        <button class="chip" data-share="no" aria-pressed="false" data-t="share.no">不同意</button>
      </div>
      <small class="muted" data-t="share.note">匿名记录，不含姓名或 IP</small>
    </section>

    <section class="modes">
      <a class="mode card" href="/match/" data-mode>
        <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="3.5" r="1.6"/><circle cx="12" cy="20.5" r="1.6"/><circle cx="4.6" cy="7.8" r="1.6"/><circle cx="19.4" cy="7.8" r="1.6"/><circle cx="4.6" cy="16.2" r="1.6"/><circle cx="19.4" cy="16.2" r="1.6"/></svg></span>
        <h3 data-t="mode.match">人机对战</h3>
        <p data-t="mode.match.d">一名真人与五个 AI 对局，无发言</p>
        <span class="go" data-t="go">进入 →</span>
      </a>
      <a class="mode card" href="/analysis/" data-mode>
        <span class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M11 7.5v7M7.5 11h7M16 16l4.5 4.5"/></svg></span>
        <h3 data-t="mode.analysis">刺杀分析</h3>
        <p data-t="mode.analysis.d">录入线下对局，由 AI 刺客推断梅林</p>
        <span class="go" data-t="go">进入 →</span>
      </a>
    </section>
    <p class="hint" data-t="home.hint">请先选择是否同意</p>
  </main>
</body>
</html>
