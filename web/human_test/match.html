<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>人机对战 · Avalon Signals</title>
  <link rel="stylesheet" href="/common.css">
  <script src="/i18n.js"></script>
  <script src="/match.js" defer></script>
</head>
<body data-title="mode.match">
  <header class="bar">
    <a class="logo" href="/"><i>A</i><span>AVALON SIGNALS</span></a>
    <button class="ibtn" id="rules-btn" data-t-label="rules">?</button>
    <button class="ibtn" data-lang-toggle aria-label="Language">EN</button>
    <button class="ibtn" id="new-btn" data-t-label="newGame"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>

  <main class="wrap grid">
    <section class="card">
      <div class="track"><div class="quests" id="quests"></div><div class="tries" id="tries"></div></div>
      <div class="ring" id="ring"><div class="center"><div class="big" id="c-big">AVALON</div><div class="sub" id="c-sub"></div></div></div>
      <p class="event" id="event"></p>
      <div class="dock sticky" id="dock"></div>
      <p class="err" id="err" hidden></p>
      <div class="center-row"><label class="switch"><input type="checkbox" id="auto"><span data-t="auto">自动</span></label></div>
    </section>
    <aside class="stack">
      <section class="card me" id="me"></section>
      <section class="card" id="talk-card" hidden><p class="label" data-t="talk">发言</p><div class="talk" id="talk"></div></section>
      <section class="card"><p class="label" data-t="log">记录</p><div id="log"></div></section>
    </aside>
  </main>

  <dialog id="setup">
    <form id="setup-form">
      <h2 data-t="setup.title">新的一局</h2>
      <div class="row"><p class="label" data-t="setup.mode">牌桌</p><div class="chips" id="mode-chips"></div></div>
      <div class="row"><p class="label" data-t="setup.role">身份</p><div class="chips" id="role-chips"></div></div>
      <div class="row"><p class="label" data-t="setup.seat">座位</p><div class="chips" id="seat-chips"></div></div>
      <div class="row"><p class="label" data-t="setup.ai">对手模型</p><div class="chips" id="ai-chips"></div></div>
      <div class="row"><p class="label" data-t="setup.share">共享本局数据</p><div class="chips" id="share-chips"></div></div>
      <p class="err" id="setup-err" hidden></p>
      <div class="actions">
        <button type="button" class="btn ghost" id="cancel" data-t="cancel">取消</button>
        <button type="submit" class="btn primary wide" id="start" data-t="start">开始</button>
      </div>
    </form>
  </dialog>

  <dialog id="rules">
    <h2 data-t="rules">规则</h2>
    <ol class="rules">
      <li data-t="rules.1"></li><li data-t="rules.2"></li><li data-t="rules.3"></li><li data-t="rules.4"></li><li data-t="rules.5"></li><li data-t="rules.6"></li><li data-t="rules.7"></li>
    </ol>
    <div class="actions"><button class="btn primary wide" id="rules-ok" data-t="ok">知道了</button></div>
  </dialog>
</body>
</html>
