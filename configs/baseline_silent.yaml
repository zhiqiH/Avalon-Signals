# Silent baseline S: no communication; self-play PPO for both teams; seeds 0, 1, 2.
# Frozen at 10,000,384 games (19,532 iterations) per seed: baseline/seed{0,1,2}/checkpoint_19532.pt, with the
# run's config, metrics and per-segment run info next to it; results/tables/baseline_silent_final.json holds its
# evaluation. Every communication configuration uses these settings unchanged. With 8 rollout workers per seed
# and the update on the GPU an iteration takes about 2 s (3 seeds at once on a 16-core CPU + laptop RTX 5070 Ti).
name: baseline_silent
seed: 0
device: auto            # the PPO update uses this device (the GPU if there is one); rollouts run on CPU
total_games: 10000000   # training budget (rounded up to whole iterations: 10,000,384 games)
games_per_iter: 512
checkpoint_every: 20
workers: 8              # rollout worker processes per seed; 3 seeds x 8 fill a 16-core / 32-thread CPU
out_dir: runs

model:
  hidden_sizes: [256, 256]
  deduction: true       # deduction fields of the observation (README, Observation)

ppo:
  lr: 3.0e-4
  epochs: 4
  minibatch_size: 2048
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  gamma: 1.0            # finite game with a single terminal reward
  gae_lambda: 0.95
  norm_adv: true

opponents:
  p_self: 0.5           # both teams current policies
  p_pool: 0.25          # one team replaced by a past snapshot
  p_rule: 0.25          # one team replaced by the rule-based player
  snapshot_every: 10
  pool_size: 20
  rule_fail_prob: 0.9
  rule_merlin_knowledge_prob: 0.5   # rule Merlin acts on his knowledge only half the time

eval:
  every: 20
  games: 512
