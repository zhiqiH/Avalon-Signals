name: baseline_silent
seed: 2
device: auto
total_games: 10000000
games_per_iter: 512
checkpoint_every: 20
workers: 8
out_dir: runs
init_from: null
resume: true
model:
  hidden_sizes:
  - 256
  - 256
  deduction: true
comm:
  enabled: false
  claim: true
  alignment: true
  rationale: true
  team: true
  intent: true
  silence: []
ppo:
  lr: 0.0003
  epochs: 4
  minibatch_size: 2048
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  gamma: 1.0
  gae_lambda: 0.95
  norm_adv: true
opponents:
  p_self: 0.5
  p_pool: 0.25
  p_rule: 0.25
  snapshot_every: 10
  pool_size: 20
  rule_fail_prob: 0.9
  rule_merlin_knowledge_prob: 0.5
eval:
  every: 20
  games: 512
